<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- =========================================================
         BASIC
    ========================================================== -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Haardik Aggarwal | Software Developer</title>

    <meta
      name="description"
      content="Portfolio of Haardik Aggarwal, a software developer focused on backend and DevOps. Explore my projects, skills, and experience."
    />

    <meta name="author" content="Haardik Aggarwal" />

    <!-- Explicitly allow search engines to index the site -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.haardik.co.in/" />


    <!-- =========================================================
         FAVICON
    ========================================================== -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />


    <!-- =========================================================

    ========================================================== -->

    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="Haardik Aggarwal" />

    <meta
      property="og:title"
      content="Haardik Aggarwal | Software Developer"
    />

    <meta
      property="og:description"
      content="Software developer focused on backend development and DevOps. Explore my projects, skills, and experience."
    />

    <meta
      property="og:url"
      content="https://www.haardik.co.in/"
    />

    <!--
      Create a 1200x630 image and place it at:
      public/og-image.png
    -->
    <meta
      property="og:image"
      content="https://www.haardik.co.in/og-image.png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="Haardik Aggarwal - Software Developer"
    />


    <!-- =========================================================
         TWITTER / X CARD
    ========================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Haardik Aggarwal | Software Developer"
    />

    <meta
      name="twitter:description"
      content="Software developer focused on backend development and DevOps. Explore my projects, skills, and experience."
    />

    <meta
      name="twitter:image"
      content="https://www.haardik.co.in/og-image.png"
    />

    <meta
      name="twitter:image:alt"
      content="Haardik Aggarwal - Software Developer"
    />

    ========================================================== -->

    <script type="application/ld+json">
